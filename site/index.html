<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Criar Personagem — Tormenta20</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="modules/t20-ficha-wizard/styles/wizard.css" />
  </head>
  <body>
    <header class="t20w-site-topo">
      <h1>Criar Personagem <small>Tormenta20</small></h1>
      <span id="t20w-status" class="t20w-hint"></span>
      <span id="t20w-salvo" class="t20w-hint"></span>
      <label class="t20w-site-nome">Seu nome <input id="t20w-jogador" type="text" maxlength="60" placeholder="para salvar no site" /></label>
      <button id="t20w-meus" type="button" class="t20w-site-btn">Meus personagens</button>
      <button id="t20w-novo" type="button" class="t20w-site-btn">Novo</button>
      <button id="t20w-abrir" type="button" class="t20w-site-btn principal" disabled>Abrir o criador</button>
    </header>
    <aside id="t20w-painel" class="t20w-painel" hidden>
      <h2>Meus personagens</h2>
      <ul id="t20w-lista"></ul>
    </aside>
    <main id="t20w-site-app"></main>
    <div id="t20w-toasts"></div>

    <dialog id="t20w-pronto" class="t20w-dialogo">
      <h2>Ficha pronta</h2>
      <p><strong id="t20w-pronto-nome"></strong> <span id="t20w-pronto-resumo" class="t20w-hint"></span></p>
      <p>Baixe o arquivo e, no Foundry, use o botão <strong>Importar ficha (JSON do site)</strong> na aba Atores. A ficha também fica salva em "Meus personagens" se você tiver informado seu nome.</p>
      <p><a id="t20w-baixar" class="t20w-btn" href="#">⬇ Baixar JSON</a> <button id="t20w-fechar-pronto" type="button" class="t20w-site-btn">Fechar</button></p>
    </dialog>
    <dialog id="t20w-item" class="t20w-dialogo">
      <h2 id="t20w-item-titulo"></h2>
      <div id="t20w-item-corpo" class="t20w-item-corpo"></div>
      <p><button id="t20w-fechar-item" type="button" class="t20w-site-btn">Fechar</button></p>
    </dialog>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
